<script src="{{ url_for('static', filename='js/script.js') }}"></script>
<body>
    <h1>Détail des espèces</h1>

<div>
    <h2>Billets</h2>
    {% for billet in billets %}
    <div class="ligne" data-valeur="{{ billet }}">
        <span>{{ billet }} €</span> x
        <input type="number" min="0" class="quantite">
        = <span class="sous-total">0,00 €</span>
    </div>
    {% endfor %}
    
    <h2>Pièces</h2>
    {% for piece in pieces %}
    <div class="ligne" data-valeur="{{ piece }}">
        <span>{{ piece }} €</span> x
        <input type="number" min="0" class="quantite">
        = <span class="sous-total">0,00 €</span>
    </div>
    {% endfor %}
</div>
<div>
    <strong>Total : <span id="total">0,00 €</span></strong>
</div>
<button id="btn-enregistrer">Enregistrer le comptage</button>
</body>
